# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python tests

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # Cancel superseded runs of a pull request, never the runs on master
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:

    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write # to comment the coverage table on a pull request
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.11"
          # the default Python of the current Raspberry Pi OS (Debian 13)
          - "3.13"
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install system dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y libcap-dev libturbojpeg
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -U -r requirements.txt
        pip install -U -r requirements-multi.txt
        pip install pylint~=2.17.7
        pip install -U 'ruff~=0.16.10' pytest pytest-doctestplus pytest-mypy pytest-cov mock
        pip install --force-reinstall git+https://github.com/prusa3d/prusa-connect-sdk-printer.git
        pip install --force-reinstall git+https://github.com/prusa3d/gcode-metadata.git

    - name: Lint with ruff
      run: |
        ruff check .
    - name: Lint with pylint
      run: |
        PYTHONPATH=`pwd` pylint prusa/link tests
    - name: Lint with mypy and doctests
      run: |
        PYTHONPATH=`pwd` pytest -v --no-cov --mypy --doctest-plus --doctest-rst prusa/link
    - name: Tests
      run: |
        PYTHONPATH=`pwd` pytest -v --mypy --doctest-plus --doctest-rst tests
    - name: Make the coverage table
      # One Python version is enough, the numbers are the same.
      if: matrix.python-version == '3.13'
      run: |
        {
          echo "### Test coverage of prusa.link"
          echo
          python -m coverage report --format=markdown --skip-empty
        } > coverage.md
        cat coverage.md >> "$GITHUB_STEP_SUMMARY"
    - name: Comment the table on the pull request
      # Not for pushes (there is no pull request) and not for forks (their
      # token cannot write); the summary of the run has the table anyway.
      if: >
        matrix.python-version == '3.13' &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      env:
        GH_TOKEN: ${{ github.token }}
      run: >
        gh pr comment ${{ github.event.pull_request.number }}
        --edit-last --create-if-none --body-file coverage.md
