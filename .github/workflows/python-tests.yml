# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:

    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.11"
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install system dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y libcap-dev libturbojpeg
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -U -r requirements.txt
        pip install -U -r requirements-multi.txt
        pip install pylint~=2.17.7
        pip install -U 'ruff~=0.16.10' pytest pytest-doctestplus pytest-mypy mock
        pip install --force-reinstall git+https://github.com/prusa3d/prusa-connect-sdk-printer.git
        pip install --force-reinstall git+https://github.com/prusa3d/gcode-metadata.git

    - name: Lint with ruff
      run: |
        ruff check .
    - name: Lint with pylint
      run: |
        PYTHONPATH=`pwd` pylint prusa/link tests
    - name: Lint with mypy and doctests
      run: |
        PYTHONPATH=`pwd` pytest -v --mypy --doctest-plus --doctest-rst prusa/link
    - name: Tests
      run: |
        PYTHONPATH=`pwd` pytest -v --mypy --doctest-plus --doctest-rst tests
